# Supabase Auth ayarları — uygulamak için: supabase config push --project-ref krfbirijwpzzmxwlesfg
# Sadece burada yazan ayarlar gönderilir; diğerleri panelde olduğu gibi kalır.
project_id = "tracker-tv"

[auth]
site_url = "https://tracker-tv-seven.vercel.app"
additional_redirect_urls = ["https://tracker-tv-seven.vercel.app/**", "http://localhost:3000/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.rate_limit]
# Sign-in/sign-up requests reach Supabase from our server (Vercel), so this works as a site-wide limit
sign_in_sign_ups = 150
